<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --cream: #FBF6EE;
    --sand: #F3E6D8;
    --sand-deep: #E8D2B8;
    --ink: #4A3229;
    --muted: #8C7267;
    --line: #EBDDD0;
    --cbh: #C97B5A;
    --cbh-deep: #A85F42;
    --jrome: #9CB380;
    --jrome-deep: #78955C;
    --gold: #D8A657;
    --white: #FFFFFF;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background: var(--cream); color: var(--ink); font-family:'Quicksand', sans-serif; -webkit-font-smoothing: antialiased; }
  h1,h2,h3,.display{ font-family:'Fraunces', serif; font-weight:600; margin:0; }
  button{ font-family:'Quicksand', sans-serif; font-weight:700; border:none; cursor:pointer; background:none; }
  input,textarea,select{ font-family:'Quicksand', sans-serif; }
  ::-webkit-scrollbar{ display:none; }

  #app{ max-width:420px; margin:0 auto; min-height:100vh; background:var(--cream); position:relative; padding-bottom:84px; overflow-x:hidden; }

  .topbar{ padding: 20px 20px 6px; }
  .topbar .kicker{ font-size:11.5px; color:var(--muted); letter-spacing:.3px; }
  .topbar h1{ font-size:21px; line-height:1.25; }
  .topbar .sub{ font-size:12.5px; color:var(--muted); margin-top:2px; }

  .brand-switch{ margin:16px 20px 4px; display:flex; background:var(--white); border-radius:999px; padding:5px; border:1.5px solid var(--line); }
  .brand-switch button{ flex:1; padding:10px 8px; border-radius:999px; background:transparent; font-size:13.5px; color:var(--muted); transition:all .25s ease; }
  .brand-switch button.active.cbh{ background:var(--cbh); color:white; }
  .brand-switch button.active.jrome{ background:var(--jrome); color:white; }
  .brand-sub{ margin:10px 20px 4px; font-size:12.5px; color:var(--muted); line-height:1.5; }

  .chips{ display:flex; gap:8px; padding:14px 20px 4px; overflow-x:auto; }
  .chip{ flex:0 0 auto; padding:8px 16px; border-radius:999px; background:var(--sand); font-size:13px; font-weight:700; color:var(--ink); white-space:nowrap; border:1.5px solid transparent; }
  .chip.active{ border-color:var(--ink); background:var(--white); }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px 20px 10px; }
  .card{ background:var(--white); border-radius:22px; overflow:hidden; border:1.5px solid var(--line); display:flex; flex-direction:column; position:relative; }
  .card .art{ height:108px; display:flex; align-items:center; justify-content:center; position:relative; background-size:cover; background-position:center; }
  .card .art svg{ width:54px; height:54px; }
  .soldout-badge{ position:absolute; inset:0; background:rgba(74,50,41,0.55); display:flex; align-items:center; justify-content:center; color:white; font-size:12px; font-weight:700; letter-spacing:.5px; }
  .card .info{ padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card .name{ font-size:13.5px; font-weight:700; line-height:1.3; }
  .card .desc{ font-size:11px; color:var(--muted); line-height:1.4; min-height:28px; }
  .card .bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; }
  .card .price{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; }
  .add-btn{ width:30px; height:30px; border-radius:50%; background:var(--ink); color:white; font-size:16px; display:flex; align-items:center; justify-content:center; }
  .add-btn:active{ transform:scale(.85); }
  .add-btn:disabled{ background:var(--line); }
  .qty-stepper{ display:flex; align-items:center; gap:8px; background:var(--sand); border-radius:999px; padding:3px 6px; }
  .qty-stepper button{ width:22px; height:22px; border-radius:50%; background:var(--white); font-size:14px; }
  .qty-stepper span{ font-size:13px; font-weight:700; min-width:14px; text-align:center; }

  .cart-pill{ position:fixed; left:50%; transform:translateX(-50%); bottom:90px; max-width:380px; width:calc(100% - 40px); background:var(--ink); color:var(--cream); border-radius:999px; padding:13px 20px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 10px 24px rgba(74,50,41,.25); font-size:13.5px; font-weight:700; z-index:40; transition:opacity .25s ease, transform .25s ease; }
  .cart-pill.hidden{ opacity:0; pointer-events:none; transform:translateX(-50%) translateY(20px); }
  .cart-pill .cnt{ background:var(--gold); color:var(--ink); border-radius:50%; width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; font-size:11px; margin-right:8px; }

  .bottomnav{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:420px; background:var(--white); border-top:1.5px solid var(--line); display:flex; padding:8px 6px 14px; z-index:50; }
  .navbtn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; color:var(--muted); font-size:10.5px; font-weight:700; }
  .navbtn svg{ width:20px; height:20px; }
  .navbtn.active{ color:var(--cbh-deep); }
  .navbtn .dot{ width:5px; height:5px; border-radius:50%; background:var(--cbh); margin-top:1px; opacity:0; }
  .navbtn.active .dot{ opacity:1; }

  .screen{ display:none; }
  .screen.active{ display:block; }

  .section-title{ padding:18px 20px 6px; font-size:18px; }
  .section-sub{ padding:0 20px 10px; font-size:12.5px; color:var(--muted); }

  .cart-item{ display:flex; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); align-items:center; }
  .cart-item .art{ width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; background-size:cover; background-position:center; }
  .cart-item .art svg{ width:30px; height:30px; }
  .cart-item .mid{ flex:1; }
  .cart-item .mid .brandtag{ font-size:10px; font-weight:700; }
  .cart-item .mid .nm{ font-size:13.5px; font-weight:700; margin:2px 0; }
  .cart-item .mid .pr{ font-size:12px; color:var(--muted); }

  .fulfill-toggle{ margin:16px 20px 4px; display:flex; gap:10px; }
  .fulfill-toggle button{ flex:1; padding:14px 10px; border-radius:18px; background:var(--white); border:1.5px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--muted); font-size:12.5px; }
  .fulfill-toggle button svg{ width:22px; height:22px; }
  .fulfill-toggle button.active{ border-color:var(--ink); background:var(--sand); color:var(--ink); }

  .field-block{ margin:12px 20px; }
  .field-block label{ font-size:12px; color:var(--muted); font-weight:700; display:block; margin-bottom:6px; }
  .field-block input, .field-block textarea{ width:100%; padding:12px 14px; border-radius:14px; border:1.5px solid var(--line); background:var(--white); font-size:13px; color:var(--ink); }
  .field-block input:focus, .field-block textarea:focus{ outline:none; border-color:var(--cbh); }
  .two-col{ display:flex; gap:10px; }
  .two-col .field-block{ flex:1; margin-left:0; margin-right:0; }

  .summary{ margin:18px 20px; background:var(--white); border-radius:20px; border:1.5px solid var(--line); padding:16px 18px; }
  .summary-row{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; color:var(--muted); }
  .summary-row.total{ color:var(--ink); font-weight:700; font-size:15px; border-top:1.5px dashed var(--line); margin-top:6px; padding-top:12px; }
  .summary-row .free{ color:var(--jrome-deep); font-weight:700; }
  .promo-row{ display:flex; gap:8px; margin: 4px 20px 0; }
  .promo-row input{ flex:1; padding:12px 14px; border-radius:14px; border:1.5px solid var(--line); font-size:12.5px; }
  .promo-row button{ padding:0 16px; border-radius:14px; background:var(--ink); color:white; font-size:12px; }

  .primary-btn{ display:block; width:calc(100% - 40px); margin:18px 20px 4px; padding:16px; background:var(--ink); color:var(--cream); border-radius:18px; font-size:14.5px; font-weight:700; text-align:center; }
  .primary-btn:disabled{ opacity:.5; }
  .primary-btn.gold{ background:var(--gold); color:var(--ink); }
  .primary-btn.outline{ background:var(--white); color:var(--ink); border:1.5px solid var(--ink); }
  .primary-btn.wa{ background:#3FA55A; color:white; }

  .empty-state{ text-align:center; padding:70px 40px; color:var(--muted); }
  .empty-state svg{ width:64px; height:64px; margin-bottom:14px; opacity:.7; }
  .empty-state h3{ font-size:16px; color:var(--ink); margin-bottom:6px; }
  .empty-state p{ font-size:12.5px; line-height:1.5; }

  .order-card{ margin:14px 20px; background:var(--white); border-radius:22px; border:1.5px solid var(--line); padding:18px; }
  .order-card .oh{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .order-card .oh .oid{ font-family:'Fraunces',serif; font-size:16px; }
  .order-card .oh .mode{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--sand); }
  .status-badge{ display:inline-block; padding:5px 12px; border-radius:999px; font-size:11.5px; font-weight:700; background:var(--sand); color:var(--ink); }
  .status-badge.completed{ background:#E1EDD8; color:var(--jrome-deep); }
  .status-badge.cancelled{ background:#F3DCDC; color:#A24444; }
  .order-items{ font-size:12px; color:var(--muted); margin-top:14px; line-height:1.6; }

async function loadProfile(){
  const { data } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
  state.profile = data;
}
function setAuthMode(mode){ state.authMode = mode; state.authErr=''; renderAccount(); }

async function doSignUp(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const refCode = document.getElementById('auth-refcode')?.value.trim();
  if(!email || !password){ state.authErr='Please fill in email and password.'; renderAccount(); return; }
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: refCode ? { referred_by_code: refCode } : {} } });
  if(error){ state.authErr = error.message; renderAccount(); return; }
  state.session = data.session;
  if(state.session){ await loadProfile(); }
  state.authErr = state.session ? '' : 'Check your email to confirm your account, then log in.';
  renderAccount();
}
async function doLogIn(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ state.authErr = error.message; renderAccount(); return; }
  state.session = data.session;
  await loadProfile();
  renderAccount();
}
async function doSignOut(){
  await sb.auth.signOut();
  state.session = null; state.profile = null;
  renderAccount();
}
async function claimWelcomeGift(){
  const { data, error } = await sb.rpc('claim_welcome_gift');
  if(error){ showToast('Something went wrong.'); return; }
  if(data.claimed){ showToast(`Welcome gift added: RM${Number(data.amount).toFixed(2)} 🎁`); await loadProfile(); renderAccount(); }
  else{ showToast('Welcome gift already claimed.'); }
}
function copyReferral(){
  if(state.profile?.referral_code) showToast('Referral code: ' + state.profile.referral_code);
}

async function renderAccount(){
  const body = document.getElementById('account-body');
  if(!state.session){
    body.innerHTML = `
      <div class="auth-toggle">
        <button class="${state.authMode==='login'?'active':''}" onclick="setAuthMode('login')">Log in</button>
        <button class="${state.authMode==='signup'?'active':''}" onclick="setAuthMode('signup')">Sign up</button>
      </div>
      <div class="field-block"><label>Email</label><input type="email" id="auth-email"></div>
      <div class="field-block"><label>Password</label><input type="password" id="auth-password"></div>
      ${state.authMode==='signup' ? `<div class="field-block"><label>Referral code (optional)</label><input type="text" id="auth-refcode" placeholder="e.g. AB12CD"></div>` : ''}
      ${state.authErr ? `<div class="err-text">${state.authErr}</div>` : ''}
      <button class="primary-btn" onclick="${state.authMode==='login' ? 'doLogIn()' : 'doSignUp()'}">${state.authMode==='login' ? 'Log in' : 'Create account'}</button>
      <div class="section-sub">Members earn wallet cashback on every order, get a welcome gift, and can refer friends for rewards.</div>
    `;
    return;
  }

  body.innerHTML = `<div class="loading">Loading your account…</div>`;
  const [{ data: orders }, { data: txs }] = await Promise.all([
    sb.from('orders').select('*, order_items(*)').eq('member_id', state.session.user.id).order('created_at', {ascending:false}),
    sb.from('wallet_transactions').select('*').eq('member_id', state.session.user.id).order('created_at', {ascending:false}).limit(20)
  ]);

  const ordersHtml = (orders||[]).length ? orders.map(o=>`
    <div class="member-order">
      <div class="oh"><span style="font-family:'Fraunces',serif;">${o.order_number}</span><span class="status-badge ${o.status}">${o.status}</span></div>
      <div class="order-items">${(o.order_items||[]).map(i=>`${i.product_name} ×${i.quantity}`).join('<br>')}</div>
      <div class="order-total"><span>Total</span><span>RM${Number(o.total).toFixed(2)}</span></div>
    </div>
  `).join('') : `<div class="section-sub">No orders yet.</div>`;

  const txHtml = (txs||[]).length ? txs.map(t=>`
    <div class="wallet-tx"><span>${t.reason}</span><span class="amt ${t.amount>=0?'pos':'neg'}">${t.amount>=0?'+':''}RM${Number(t.amount).toFixed(2)}</span></div>
  `).join('') : `<div class="section-sub">No wallet activity yet.</div>`;

  body.innerHTML = `
    <div class="section-sub" style="padding-top:0;">Signed in as ${state.session.user.email}</div>
    <div class="wallet-hero">
      <div class="lbl">Wallet balance</div>
      <div class="num">RM${Number(state.profile?.wallet_balance||0).toFixed(2)}</div>
      <div class="sub">Earn ${Math.round((state.settings.reward_rate||0)*100)}% cashback on every order</div>
    </div>
    ${!state.profile?.welcome_gift_claimed ? `<button class="primary-btn gold" onclick="claimWelcomeGift()">🎁 Claim your welcome gift</button>` : ''}

    <div class="referral-card">
      <h3>Share the love</h3>
      <p>Give this code to a friend. When their first order is completed, you both get RM${Number(state.settings.referral_bonus||5).toFixed(2)} added to your wallet.</p>
      <div class="code-row">
        <span class="code">${state.profile?.referral_code || '—'}</span>
        <button onclick="copyReferral()">Copy</button>
      </div>
    </div>

    <div class="section-title">Wallet history</div>
    ${txHtml}

    <div class="section-title">Your orders</div>
    ${ordersHtml}

    <button class="primary-btn outline" onclick="doSignOut()">Sign out</button>
  `;
}


function goTo(tab){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.navbtn[data-tab="${tab}"]`).classList.add('active');
  if(tab==='cart') renderCart();
  if(tab==='account') renderAccount();
  renderCartPill();
  window.scrollTo(0,0);
}
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

loadData();
initSession();
</script>
</body>
