<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cbakinghouse × J.ROME Pastry</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FBF8F3;
      --sand: #F5EFE6;
      --ink: #5C4033;
      --muted: #8B7355;
      --line: #E8DCC8;
      --cbh: #C97B5A;
      --cbh-light: #E8C5B0;
      --cbh-dark: #A85F42;
      --jrome: #9CB380;
      --jrome-light: #B8D4A0;
      --gold: #D4A574;
      --warm-orange: #E8A657;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Quicksand', sans-serif; background: var(--cream); color: var(--ink); }
    h1, h2, h3 { font-family: 'Fraunces', serif; }

    #app { max-width: 420px; margin: 0 auto; min-height: 100vh; background: var(--cream); padding-bottom: 80px; }
    .topbar { background: white; border-bottom: 1.5px solid var(--line); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 40; }
    .topbar-icons { display: flex; gap: 12px; }
    .topbar-btn { background: none; border: none; font-size: 18px; cursor: pointer; position: relative; }

    .screen { display: none; }
    .screen.active { display: block; }

    .home-hero { background: linear-gradient(135deg, #E8C5B0 0%, #F0E8DC 100%); padding: 24px 20px; text-align: center; }
    .hero-emoji { font-size: 48px; margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .hero-title { font-size: 26px; color: #5C4033; margin-bottom: 4px; }
    .hero-sub { font-size: 13px; color: #8B7355; }

    .brand-switch { margin: 16px 20px; display: flex; gap: 8px; }
    .brand-btn { flex: 1; padding: 14px; border-radius: 12px; background: white; border: 2px solid var(--line); font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .brand-btn.active { border-color: transparent; color: white; }
    .brand-btn.cbh.active { background: var(--cbh); }
    .brand-btn.jrome.active { background: var(--jrome); }

    .member-banner { margin: 0 20px 16px; padding: 16px; background: linear-gradient(135deg, #E8C5B0 0%, #F0E8DC 100%); border-radius: 12px; text-align: center; color: #5C4033; }
    .member-banner h3 { font-size: 14px; margin-bottom: 4px; }
    .member-banner p { font-size: 12px; opacity: 0.85; margin: 8px 0; }

    .category-chips { display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto; }
    .chip { flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; background: white; font-size: 12px; font-weight: 700; color: var(--muted); border: 1.5px solid var(--line); cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .chip.active { border-color: var(--cbh); background: var(--cbh); color: white; }

    .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 20px; margin-bottom: 20px; }
    .product-card { background: white; border-radius: 16px; overflow: hidden; border: 1.5px solid var(--line); display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .product-card:hover { box-shadow: 0 8px 16px rgba(201, 123, 90, 0.1); }

    .product-img { width: 100%; height: 120px; background: linear-gradient(135deg, #F0E8DC 0%, #E8DCC8 100%); display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .product-info { padding: 12px; flex: 1; display: flex; flex-direction: column; }
    .product-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
    .product-price { font-family: 'Fraunces', serif; font-size: 14px; font-weight: 700; color: var(--cbh); margin-bottom: 8px; }
    .add-btn { width: 100%; padding: 8px; background: linear-gradient(135deg, #C97B5A 0%, #A85F42 100%); color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

    .cart-header { padding: 20px; border-bottom: 1.5px solid var(--line); }
    .cart-empty { padding: 60px 20px; text-align: center; }
    .cart-empty .icon { font-size: 48px; margin-bottom: 16px; }
    .cart-empty p { color: var(--muted); }

    .cart-items { padding: 0; }
    .cart-item { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; }
    .cart-item-img { width: 80px; height: 80px; background: linear-gradient(135deg, #F0E8DC 0%, #E8DCC8 100%); border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 36px; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: 700; margin-bottom: 4px; font-size: 14px; }

    .bottomnav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 420px; left: 50%; transform: translateX(-50%); background: white; border-top: 1.5px solid var(--line); display: flex; justify-content: space-around; padding: 8px 0 14px; z-index: 50; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 700; background: none; border: none; }
    .nav-item.active { color: var(--cbh); }
  </style>
</head>
<body>
  <div id="app">
    <!-- TOPBAR -->
    <div class="topbar">
      <div style="font-size: 12px; font-weight: 700; color: #C97B5A;">Cbakinghouse × J.ROME</div>
      <div class="topbar-icons">
        <button class="topbar-btn" onclick="alert('💬 WhatsApp: 601110821733')">💬</button>
        <button class="topbar-btn" onclick="goToCart()">🛒</button>
      </div>
    </div>

    <!-- HOME SCREEN -->
    <div class="screen active" id="homeScreen">
      <div class="home-hero">
        <div class="hero-emoji">🤍</div>
        <h1 class="hero-title">Cbakinghouse × J.ROME Pastry</h1>
        <p class="hero-sub">Freshly Baked Everyday 🥐</p>
      </div>

      <div class="brand-switch">
        <button class="brand-btn cbh active" onclick="switchBrand('cbh')">🥯 Cbakinghouse</button>
        <button class="brand-btn jrome" onclick="switchBrand('jrome')">🍰 J.ROME Pastry</button>
      </div>

      <div class="member-banner">
        <h3>📢 Order before 6PM for next-day delivery</h3>
      </div>

      <div class="category-chips" id="categoryChips"></div>
      <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- CART SCREEN -->
    <div class="screen" id="cartScreen">
      <div class="cart-header">
        <h2>🛒 Shopping Cart</h2>
      </div>
      <div id="cartContent"></div>
      <div class="bottomnav">
        <button class="nav-item active" onclick="goToHome()"><span>🏠</span> Home</button>
        <button class="nav-item" onclick="goToCart()"><span>🛒</span> Cart</button>
        <button class="nav-item" onclick="alert('💬 WhatsApp: 601110821733')"><span>💬</span> Chat</button>
      </div>
    </div>
  </div>

  <script>
    let currentBrand = 'cbh';
    let currentCategory = 'all';
    let cart = [];

    const products = [
      // Cbakinghouse
      { id: 'cbh1', name: 'Pistachio Basque', brand: 'cbh', category: 'Basque', price: 15.90, emoji: '🍰' },
      { id: 'cbh2', name: 'Matcha Basque', brand: 'cbh', category: 'Basque', price: 15.90, emoji: '🍰' },
      { id: 'cbh3', name: 'Brownie Bliss', brand: 'cbh', category: 'Brownie', price: 8.50, emoji: '🍫' },
      { id: 'cbh4', name: 'Sea Salt Roll', brand: 'cbh', category: 'Bread', price: 4.50, emoji: '🥖' },
      { id: 'cbh5', name: 'Sweet Red Bean', brand: 'cbh', category: 'Bread', price: 5.00, emoji: '🥖' },
      { id: 'cbh6', name: 'Coffee Bun', brand: 'cbh', category: 'Bread', price: 4.80, emoji: '🥖' },
      { id: 'cbh7', name: 'Original Bagel', brand: 'cbh', category: 'Bagel', price: 4.50, emoji: '🥯' },
      { id: 'cbh8', name: 'Shiopan', brand: 'cbh', category: 'Shiopan', price: 5.50, emoji: '🥐' },
      { id: 'cbh9', name: 'Sourdough', brand: 'cbh', category: 'Sourdough', price: 6.00, emoji: '🍞' },
      { id: 'cbh10', name: 'Waffle', brand: 'cbh', category: 'Waffle', price: 5.50, emoji: '🧇' },

      // J.ROME
      { id: 'jr1', name: 'Classic Basque', brand: 'jrome', category: 'Basque', price: 15.90, emoji: '🍰' },
      { id: 'jr2', name: 'Taro Basque', brand: 'jrome', category: 'Basque', price: 16.50, emoji: '🍰' },
      { id: 'jr3', name: 'Dark Chocolate', brand: 'jrome', category: 'Basque', price: 16.50, emoji: '🍰' },
      { id: 'jr4', name: 'Mochi Daifuku', brand: 'jrome', category: 'Daifuku', price: 12.00, emoji: '🍡' },
      { id: 'jr5', name: 'Matcha Daifuku', brand: 'jrome', category: 'Daifuku', price: 12.50, emoji: '🍡' },
      { id: 'jr6', name: 'Design Cake', brand: 'jrome', category: 'Design Cake', price: 25.00, emoji: '🎂' },
      { id: 'jr7', name: 'Brownie', brand: 'jrome', category: 'Brownie', price: 9.00, emoji: '🍫' }
    ];

    function switchBrand(brand) {
      currentBrand = brand;
      currentCategory = 'all';
      document.querySelectorAll('.brand-btn').forEach(b => b.classList.remove('active'));
      if (brand === 'cbh') {
        document.querySelectorAll('.brand-btn.cbh')[0].classList.add('active');
      } else {
        document.querySelectorAll('.brand-btn.jrome')[0].classList.add('active');
      }
      renderUI();
    }

    function renderUI() {
      const filtered = products.filter(p => p.brand === currentBrand);
      const cats = [...new Set(filtered.map(p => p.category))];
      
      let html = '<button class="chip active" onclick="setCategory(\'all\')">All</button>';
      cats.forEach(c => {
        html += `<button class="chip" onclick="setCategory('${c}')">${c}</button>`;
      });
      document.getElementById('categoryChips').innerHTML = html;
      
      const prods = currentCategory === 'all' 
        ? filtered 
        : filtered.filter(p => p.category === currentCategory);
      
      html = prods.map(p => `
        <div class="product-card">
          <div class="product-img">${p.emoji}</div>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-price">RM ${p.price.toFixed(2)}</div>
            <button class="add-btn" onclick="addCart('${p.id}')">+ Add 🛒</button>
          </div>
        </div>
      `).join('');
      document.getElementById('productsGrid').innerHTML = html;
    }

    function setCategory(c) {
      currentCategory = c;
      document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderUI();
    }

    function addCart(id) {
      const p = products.find(x => x.id === id);
      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...p, qty: 1 });
      }
      alert(`✅ Added ${p.name}!`);
    }

    function goToHome() {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('homeScreen').classList.add('active');
    }

    function goToCart() {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('cartScreen').classList.add('active');
      
      if (cart.length === 0) {
        document.getElementById('cartContent').innerHTML = '<div class="cart-empty"><div class="icon">🛒</div><p>Cart is empty</p><button onclick="goToHome()" style="padding: 10px 20px; background: #C97B5A; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px;">Continue Shopping</button></div>';
      } else {
        let html = '<div class="cart-items">';
        cart.forEach((c, i) => {
          html += `<div class="cart-item"><div class="cart-item-img">${c.emoji}</div><div class="cart-item-info"><div class="cart-item-name">${c.name}</div><div style="font-size: 12px; color: #8B7355; margin-bottom: 8px;">RM ${c.price.toFixed(2)}</div><div style="display: flex; gap: 8px;"><button onclick="cart[${i}].qty--; if(cart[${i}].qty === 0) cart.splice(${i}, 1); goToCart();" style="padding: 4px 8px; background: #E8DCC8; border: none; border-radius: 4px; cursor: pointer;">−</button><span style="padding: 4px 8px;">${c.qty}</span><button onclick="cart[${i}].qty++; goToCart();" style="padding: 4px 8px; background: #E8DCC8; border: none; border-radius: 4px; cursor: pointer;">+</button></div></div></div>`;
        });
        html += '</div>';
        const total = cart.reduce((s, c) => s + (c.price * c.qty), 0);
        html += `<div style="padding: 20px; background: linear-gradient(135deg, #E8C5B0 0%, #EDE5D8 100%); margin-top: 20px;"><div style="display: flex; justify-content: space-between; margin-bottom: 12px;"><span>Subtotal:</span><span>RM ${total.toFixed(2)}</span></div><button onclick="alert('💬 WhatsApp to place order!');" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #C97B5A 0%, #A85F42 100%); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">Order Now 💳</button></div>`;
        document.getElementById('cartContent').innerHTML = html;
      }
    }

    renderUI();
  </script>
</body>
</html>
